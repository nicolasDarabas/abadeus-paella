spring.application.name=paella-api
server.port=8080

# ---------- Banco SQLite ----------
# O arquivo paella.db e criado automaticamente na pasta do projeto.
spring.datasource.url=jdbc:sqlite:paella.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite trabalha melhor com uma conexao por vez
spring.datasource.hikari.maximum-pool-size=1

# As tabelas sao criadas pelo script src/main/resources/schema.sql
spring.sql.init.mode=always
# true: permite as linhas ALTER TABLE de atualizacao no fim do schema.sql
spring.sql.init.continue-on-error=true

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Seguranca (JWT) ----------
# Troque o segredo antes de publicar (minimo 32 caracteres).
app.jwt.secret=abadeus-paella-beneficente-chave-secreta-trocar-em-producao-2026
app.jwt.expiracao-horas=12

# ---------- Regras de negocio ----------
# Minutos que o estoque fica reservado enquanto o pedido aguarda pagamento
app.pedido.minutos-reserva=30

# ---------- Administrador inicial ----------
app.admin.login=ADMINISTRADOR
app.admin.senha=ADM123
app.admin.email=admin@abadeus.org.br

# ---------- Dados de exemplo ----------
# true = cria um evento de exemplo e o comprador de teste (comprador@teste.com / 123456)
app.seed.dados-exemplo=true

# ---------- Voluntario inicial (equipe de retirada) ----------
app.voluntario.login=VOLUNTARIO
app.voluntario.senha=VOL123
app.voluntario.email=voluntario@abadeus.org.br
